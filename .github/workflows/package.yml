name: Validate and build IndexNow 1.3.0

on:
  push:
    branches:
      - main
      - develop-1.3.0
    paths-ignore:
      - 'dist/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '5.6'
          - '8.1'

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint plugin PHP files
        shell: bash
        run: |
          set -e
          find . -type f \( -name '*.php' -o -name '*.inc' \) \
            -not -path './.git/*' \
            -not -path './dist/*' \
            -print0 | xargs -0 -n1 php -l

      - name: Verify release metadata and interoperability
        if: matrix.php == '8.1'
        shell: bash
        run: |
          set -e
          grep -q "'pi_version'.*'1.3.0'" autoinstall.php
          grep -q "'pi_gl_version'.*'2.1.1'" autoinstall.php
          grep -q 'function plugin_itemsaved_indexnow' functions.inc
          grep -q "old_id !== ''" functions.inc
          grep -q 'function indexnow_resolve_previous_url_for_rename' functions.inc
          grep -q "indexnow_previous_public_url(\$type, \$old_id)" functions.inc
          grep -q "indexnow_call_idtourl('plugin_idtourl_'" functions.inc
          grep -q "indexnow_submission_context(\$type, \$old_id, \$sub_type, 'deleted')" functions.inc
          grep -q 'function plugin_itemdeleted_indexnow' functions.inc
          grep -q 'function indexnow_resolve_saved_plugin_url' functions.inc
          grep -q 'function indexnow_resolve_deleted_plugin_url' functions.inc
          grep -q 'function indexnow_validate_url' functions.inc
          grep -q 'function indexnow_validate_key' functions.inc
          grep -q 'function indexnow_sanitize_log_value' functions.inc
          grep -q 'function plugin_getcapabilities_indexnow' functions.inc
          grep -q "'indexnow.urls.submit'" functions.inc
          grep -q 'function plugin_wsEnabled_indexnow' functions.inc
          grep -q 'function service_submit_urls_indexnow' services.inc.php
          grep -q 'function service_status_read_indexnow' services.inc.php
          grep -q "'indexnow.status.read'" functions.inc
          grep -q 'function INDEXNOW_SERVICE_prepareBatch' services.inc.php
          grep -q 'function indexnow_apply_curl_security' functions.inc
          grep -q 'batchSize = 100' functions.inc
          grep -q 'indexnow_process_cleanup_queue(100)' functions.inc
          grep -q "'tables' => array('indexnow_submissions', 'indexnow_cleanup')" functions.inc
          grep -q 'function indexnow_record_submission' submission_history.php
          ! grep -q 'indexnow_process_cleanup_if_scheduled' submission_history.php
          grep -q 'function indexnow_audit_submitted_urls' cleanup.php
          grep -q 'function indexnow_process_cleanup_queue' cleanup.php
          grep -q 'function indexnow_update_1_2_1' install_updates.php
          grep -q 'indexnow_submissions' sql/mysql_install.php
          grep -q 'indexnow_cleanup' sql/mysql_install.php
          grep -q "'cleanup_run_now'" language/english.php
          grep -q "'coexistence_title'" language/english.php
          grep -q "'history_batch_accepted'" language/english.php
          grep -q "\$LANG_indexnow\['cleanup_run_now'\]" admin/index.php
          grep -q "\$LANG_indexnow\['coexistence_title'\]" admin/index.php
          grep -q 'Current development release: \*\*1.3.0\*\*' README.md
          grep -q '^## 1.3.0$' CHANGELOG.md

  package:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Build installable archive
        shell: bash
        run: |
          set -e
          rm -rf build
          mkdir -p build/indexnow

          cp -a \
            admin \
            language \
            sql \
            autoinstall.php \
            cleanup.php \
            configuration_validation.php \
            functions.inc \
            services.inc.php \
            submission_history.php \
            install_defaults.php \
            install_updates.php \
            plugin.json \
            CHANGELOG.md \
            INSTALL \
            README.md \
            build/indexnow/

          cd build
          zip -r indexnow_1.3.0_2.1.1.zip indexnow >/dev/null
          unzip -t indexnow_1.3.0_2.1.1.zip >/dev/null
          test "$(zipinfo -1 indexnow_1.3.0_2.1.1.zip | head -n 1)" = 'indexnow/'
          zipinfo -1 indexnow_1.3.0_2.1.1.zip | grep '^indexnow/plugin.json$'
          zipinfo -1 indexnow_1.3.0_2.1.1.zip | grep '^indexnow/functions.inc$'
          zipinfo -1 indexnow_1.3.0_2.1.1.zip | grep '^indexnow/services.inc.php$'
          zipinfo -1 indexnow_1.3.0_2.1.1.zip | grep '^indexnow/admin/'
          sha256sum indexnow_1.3.0_2.1.1.zip > indexnow_1.3.0_2.1.1.zip.sha256

      - name: Commit archive to dist
        shell: bash
        run: |
          set -e
          mkdir -p dist
          rm -f dist/indexnow_*.zip dist/indexnow_*.zip.sha256
          cp build/indexnow_1.3.0_2.1.1.zip dist/indexnow_1.3.0_2.1.1.zip
          cp build/indexnow_1.3.0_2.1.1.zip.sha256 dist/indexnow_1.3.0_2.1.1.zip.sha256

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -f dist

          if git diff --cached --quiet; then
            echo 'Archive is already up to date.'
            exit 0
          fi

          git commit -m 'Build IndexNow 1.3.0 installable archive [dist]'
          git push origin HEAD:${{ github.ref_name }}
